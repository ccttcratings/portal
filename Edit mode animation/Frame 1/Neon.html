<!DOCTYPE html>
<html class="neon">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #4e2a05; text-align: center; padding: 32.8px 24px 8px; margin: 0; color-scheme: dark; }
.card { background: #4e2a05; max-width: 440px; margin: 0 auto; padding: 6px 20px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
h2 { color: #fff; margin-bottom: 42px; font-size: 30px; }
p { color: #ffb3b3; font-size: 16px; margin-bottom: 30px; }
.btn {
  position: relative; display: block; text-decoration: none;
  padding: 14px; margin: 2px 0; border-radius: 12px;
  font-weight: bold; font-size: 20px; color: #000;
  transform: perspective(500px) rotateY(-12deg);
  box-shadow: 2px 0 0 4px rgba(0,0,0,.2), 0 6px 0 var(--dark), 0 10px 16px rgba(0,0,0,.35);
  overflow: hidden; border: none;
}
.btn::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
  background: linear-gradient(180deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,.15) 100%);
  border-radius: 8px 8px 50% 50%; pointer-events: none;
}
.preview { background: linear-gradient(180deg, #00ff00 0%, #00cc00 40%, #009900 100%); --dark: #006600; }
.edit { background: linear-gradient(180deg, #ff0000 0%, #cc0000 40%, #990000 100%); --dark: #660000; margin-top: 20px; margin-bottom: 2px; }
.hub { background: linear-gradient(180deg, #0bcade 0%, #09a3b5 40%, #077c9c 100%); --dark: #055f7d; margin-top: 100px; }
.copy-btn {
  position: relative; display: block; background: linear-gradient(180deg, #bf00ff 0%, #9900dd 40%, #7700bb 100%);
  color: #000; font-size: 13px; font-weight: bold; padding: 16px 14px; margin: 20px 0 45px;
  border: none; border-radius: 8px; width: 100%; box-sizing: border-box;
  transform: perspective(500px) rotateY(-12deg);
  box-shadow: 1px 0 0 3px rgba(0,0,0,.15), 0 4px 0 #550099, 0 6px 10px rgba(0,0,0,.25);
  overflow: hidden;
}
.copy-btn::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
  background: linear-gradient(180deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,.15) 100%);
  border-radius: 6px 6px 50% 50%; pointer-events: none;
}
.subtext { display: block; font-size: 12px; font-weight: normal; opacity: 0.8; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <h2>View Mode Portal</h2>
  <a class="btn preview">Preview Mode <span class="subtext">(works on most devices)</span></a>
  <button class="copy-btn">Copy Preview Mode URL</button>
  <a class="btn edit">Edit Mode <span class="subtext">(annoying banner at top)</span></a>
  <button class="copy-btn">Copy Edit Mode URL</button>
  <a class="btn hub">Portal Hub of Portals<span class="subtext">(hub of redundant portals)</span></a>
</div>
</body>
</html>
