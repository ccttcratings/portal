<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Mode Portal + Table Serve Animation</title>

    <meta name="color-scheme" content="dark">
    <script>
        var p = new URLSearchParams(location.search);
        if (p.has('neon') || (!p.has('normal') && new Date().getDate() % 2)) {
            document.documentElement.classList.add('neon');
            document.documentElement.setAttribute('data-darkreader-scheme', 'dark');
        }
    </script>

    <style>
* {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            text-size-adjust: none;
            -webkit-text-size-adjust: none;
            -moz-text-size-adjust: none;   
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent; /* Handled by ball-layer and 3D canvas */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;              /* Overrides mobile gesture overrides */
            overscroll-behavior-y: contain; /* Prevents natural browser bounce loops */
        }

        button, input, select, textarea {
            font-family: inherit;
        }

        /* Three.js 3D Background Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100vh;
            overflow: hidden;
            display: none;
            z-index: 1;
        }

        /* Ball Wrapper: Creates the spherical boundary mask */
        #ball-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fce5cd;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: clip-path 0.15s linear, background-color 0.15s linear;
            clip-path: circle(100vmax at 50% 50%); /* Base state: covers screen fully */
        }

        html.neon #ball-layer {
            background-color: #4e2a05;
        }

        /* ============================================================
           🔄 PULL-TO-REFRESH (PTR) INGUN SPINNER STYLING
           ============================================================ */
        /* Fixed only during PTR pull */
        .ptr-fixed {
            position: fixed !important;
        }

        /* ============================================================
           🛠️ CSS FIX: CENTER INGUN SPINNER INSIDE THE CARD LAYOUT
           ============================================================ */
        /* Update the parent wrapper to anchor and center the graphic box */
        #ptr {
            display: none;              /* Hidden by default until pulled */
            width: 100%;                /* Span full card width to handle horizontal alignment */
            height: 110px;              /* Provide comfortable bounding space for scaled SVG */
            position: relative;         /* ◄--- CRUCIAL: Creates the boundary anchor line for the SVG! */
            margin: 0 auto 10px;
            pointer-events: none;       /* ◄--- FORCES CLICKS TO PASS STRAIGHT THROUGH TO THE TRACKER */
        }
        }

        /* Spinner stays 48×48 but scaled up and centered mathematically */
        #ptr-svg {
            position: absolute;
            width: 48px;
            height: 48px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(2.4); /* ◄--- Centers it perfectly inside the parent box */
            transform-origin: center;
            transform-box: fill-box; 
        }

        /* Fixed only during PTR pull */
        .ptr-fixed {
            position: fixed !important;
        }

        /* Fletchings visible normally */
        #g79 {
            opacity: 1;
        }

        /* Fletchings hidden during spin */
        #ptr.spin #g79 {
            opacity: 0;
        }

        /* spin whole image — preserves scale and translation centers */
        #ptr.spin #ptr-svg {
            animation: ptrSpin .7s linear infinite;
        }

        @keyframes ptrSpin {
            from { transform: translate(-50%, -50%) scale(2.4) rotate(0deg); }
            to   { transform: translate(-50%, -50%) scale(2.4) rotate(360deg); }
        }
            
        #g1 { 
            transform-origin: 32px 32px; 
        }
        #g10 { 
            transform-origin: center; 
            transform-box: fill-box; 
        }
        
        /* Portal card UI */
        .card {
            color-scheme: light;
            max-width: 440px;
            width: 92%;
            padding: 24px 28px 20px;
            border-radius: 12px;
            text-align: center;
            
            /* --- UPDATE POSITIONING TO AN ABSOLUTE CEILING LOCK --- */
            position: absolute;      /* Rips it out of loose layout boxes */
            top: 40px;               /* ◄--- SETS PERFECT TOP SPACING ON BOTH PC AND PHONE */
            left: 50%;               /* Centers horizontally */
            transform: translateX(-50%) scale(1) translateY(0); /* Centers the horizontal pivot */
            transform-origin: top center; /* Ensures frame scaling shrinks UPWARD */
            
            z-index: 10;
            transition: transform 0.15s linear;
        }

        .card.decorative {
            pointer-events: none;
        }

        h2 { 
            color: #000000 !important;
            margin-top: 0px;
            margin-bottom: 48px; 
            font-size: 30px; 
            font-weight: 800;
            line-height: 1.1;
            display: block;
        }
        p { 
            color: #e07474; 
            font-size: 16px; 
            margin-bottom: 30px; 
        }

        .btn {
            position: relative; 
            display: block; 
            width: 100%;
            text-decoration: none;
            padding: 14px 16px; 
            margin: 4px 0; 
            border-radius: 12px;
            font-weight: bold; 
            font-size: 20px; 
            color: #000;
            transform: perspective(500px) rotateY(-12deg);
            box-shadow: 2px 0 0 4px rgba(0,0,0,.2), 0 6px 0 var(--dark), 0 10px 16px rgba(0,0,0,.35);
            overflow: hidden; 
            border: none;
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .btn::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.15) 100%);
            border-radius: 8px 8px 50% 50%; pointer-events: none;
        }
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,.3), transparent);
            transition: 0.5s; z-index: 1; pointer-events: none;
        }
        .btn:hover::before { left: 100%; }
        .btn:hover { transform: perspective(500px) rotateY(0deg); box-shadow: 0 0 0 4px rgba(0,0,0,.1), 0 2px 0 var(--dark), 0 4px 10px rgba(0,0,0,.25); }
        .btn:active { transform: perspective(500px) rotateY(0deg) translateY(2px); box-shadow: 0 0 0 4px rgba(0,0,0,.1), 0 0 0 var(--dark), 0 2px 6px rgba(0,0,0,.2); }

        .preview { background: linear-gradient(180deg, #6abf6e 0%, #3a9e3e 40%, #288028 100%); --dark: #1c6a1c; }
        .edit { background: linear-gradient(180deg, #e87070 0%, #c84040 40%, #a02020 100%); --dark: #801818; margin-top: 18px; margin-bottom: 4px; }
        .hub { background: linear-gradient(180deg, #3ba8d6 0%, #1a7daa 40%, #0e5f80 100%); --dark: #0a4a60; margin-top: 80px; }

        .copy-btn {
            position: relative; 
            display: block; 
            background: linear-gradient(180deg, #a048a0 0%, #883088 40%, #682068 100%);
            color: #000; 
            font-size: 14px; 
            font-weight: bold; 
            padding: 14px 16px; 
            margin: 16px 0 32px;
            border: none; 
            border-radius: 10px; 
            width: 100%; 
            cursor: pointer;
            transform: perspective(500px) rotateY(-12deg);
            box-shadow: 1px 0 0 3px rgba(0,0,0,.15), 0 4px 0 #501850, 0 6px 10px rgba(0,0,0,.25);
            overflow: hidden; 
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .copy-btn::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.15) 100%);
            border-radius: 6px 6px 50% 50%; pointer-events: none;
        }
        .copy-btn:hover { transform: perspective(500px) rotateY(0deg); box-shadow: 0 0 0 3px rgba(0,0,0,.08), 0 1px 0 #501850, 0 3px 8px rgba(0,0,0,.2); }
        .copy-btn:active { transform: perspective(500px) rotateY(0deg) translateY(2px); box-shadow: 0 0 0 3px rgba(0,0,0,.08), 0 0 0 #501850, 0 2px 4px rgba(0,0,0,.15); }
        .copy-btn.copied { background: linear-gradient(180deg, #a8c7a8 0%, #88b088 40%, #709870 100%); --dark: #5a805a; }

        .subtext { display: block; font-size: 12px; font-weight: normal; opacity: 0.85; margin-top: 4px; }

        html.neon .preview { background: linear-gradient(180deg, #00ff00 0%, #00cc00 40%, #009900 100%); --dark: #006600; }
        html.neon .edit { background: linear-gradient(180deg, #ff0000 0%, #cc0000 40%, #990000 100%); --dark: #660000; }
        html.neon .hub { background: linear-gradient(180deg, #0bcade 0%, #09a3b5 40%, #077c9c 100%); --dark: #055f7d; }
        html.neon .copy-btn { background: linear-gradient(180deg, #bf00ff 0%, #9900dd 40%, #7700bb 100%); box-shadow: 1px 0 0 3px rgba(0,0,0,.15), 0 4px 0 #550099, 0 6px 10px rgba(0,0,0,.25); }
        html.neon body { background: #4e2a05; }
        html.neon .card { background: #4e2a05; }
        html.neon h2 { color: #000 !important; }
        html.neon p { color: #ffb3b3; }

        /* Frame Scrubber HUD */
        #scrub-hint {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.90);
            color: #f8fafc;
            padding: 9px 22px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

    <script>
        const previewUrl = "https://docs.google.com/spreadsheets/d/1_Ou_wAKDovm5ASpc85cpGGbxKZcJkiEIEgifOE0ClBk/preview";
        const editUrl = "https://docs.google.com/spreadsheets/d/1_Ou_wAKDovm5ASpc85cpGGbxKZcJkiEIEgifOE0ClBk/edit?gid=196901061#gid=196901061";

        function copyUrl(btn, url) {
            navigator.clipboard.writeText(url).then(() => {
                btn.textContent = "Copied!";
                btn.classList.add("copied");
                setTimeout(() => {
                    btn.textContent = btn.getAttribute("data-label");
                    btn.classList.remove("copied");
                }, 2000);

                const card = document.getElementById('portal-card');
                if (card) {
                    card.classList.add('decorative');
                    card.setAttribute('inert', '');
                    card.querySelectorAll('a, button').forEach((el) => {
                        el.setAttribute('tabindex', '-1');
                        el.setAttribute('aria-disabled', 'true');
                    });
                    btn.blur();
                }
            });
        }

        document.getElementById('copy-preview-btn').onclick = function () {
            copyUrl(this, previewUrl);
        };
        document.getElementById('copy-edit-btn').onclick = function () {
            copyUrl(this, editUrl);
        };

    <script>

            function makeTableTexture() {
                const c = document.createElement('canvas');
                c.width = 2048;
                c.height = 2048;
                const ctx = c.getContext('2d');
                
                const grad = ctx.createLinearGradient(0, 0, 0, c.height);
                grad.addColorStop(0.00, '#040d24');
                grad.addColorStop(0.25, '#06132f');
                grad.addColorStop(0.50, '#091e48');
                grad.addColorStop(0.75, '#06132d');
                grad.addColorStop(1.00, '#030a1c');

                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, c.width, c.height);

                const imgData = ctx.getImageData(0, 0, c.width, c.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * 3.5;
                    data[i]     = Math.min(255, Math.max(0, data[i]     + noise));
                    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
                    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
                }
                ctx.putImageData(imgData, 0, 0);

                const seamT = (NET_Z + TABLE_LEN / 2) / TABLE_LEN;
                const seamY = Math.round(c.height * (1 - seamT));
                ctx.fillStyle = 'rgba(1, 4, 10, 0.75)';
                ctx.fillRect(0, seamY - 1, c.width, 2);

                const tex = new THREE.CanvasTexture(c);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = 8;
                return tex;
            }

            function makeNetTexture() {
                const c = document.createElement('canvas');
                c.width = 512;
                c.height = 256;
                const ctx = c.getContext('2d');
                ctx.clearRect(0, 0, c.width, c.height);

                const tapeH = 15;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, c.width, tapeH);
                ctx.fillRect(0, c.height - 4, c.width, 4);

                const gridSize = 9;
                ctx.strokeStyle = '#1a1d24';
                ctx.lineWidth = 2.4;
                for (let x = 0; x <= c.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, tapeH);
                    ctx.lineTo(x, c.height - 4);
                    ctx.stroke();
                }
                for (let y = tapeH + gridSize; y <= c.height - 4; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(c.width, y);
                    ctx.stroke();
                }

                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                tex.repeat.set(14, 1);
                return tex;
            }

            const ANGLE_DEG = 40;

            function makeDonicStressTexture() {
                const c = document.createElement('canvas');

                ctx.clearRect(0, 0, c.width, c.height);

                const xOuter = 1016;
                const xInner = 8;
                const yTop = 8;
                const yDonic = 115;
                const yBottom = 360;
                const cornerR = 56;

                const canvas_dy = yBottom - yDonic;
                const canvas_dx = 269;
                const xSlopeEnd = xOuter - canvas_dx;

                ctx.beginPath();
                ctx.moveTo(xInner, yBottom);
                ctx.lineTo(xInner, yTop + cornerR);
                ctx.quadraticCurveTo(xInner, yTop, xInner + cornerR, yTop);
                ctx.lineTo(xOuter, yTop);
                ctx.lineTo(xOuter, yDonic);
                ctx.lineTo(xSlopeEnd, yBottom);
                ctx.lineTo(xInner, yBottom);
                ctx.closePath();

                const grad = ctx.createLinearGradient(0, 0, 0, c.height);
                grad.addColorStop(0, '#f1f5f9');
                grad.addColorStop(0.35, '#dbe2ec');
                grad.addColorStop(0.65, '#bdc7d5');
                grad.addColorStop(1, '#a1acbc');
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.save();
                ctx.clip();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                for (let y = 3; y < c.height; y += 4) ctx.fillRect(0, y, c.width, 1.2);

                for (let y = 5; y < c.height; y += 6) ctx.fillRect(0, y, c.width, 1.2);

                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.save();
                ctx.translate(620, yDonic);
                ctx.transform(1, 0, -0.22, 1, 0, 0);

                ctx.font = '900 148px "Arial Black", Impact, -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#050507';
                ctx.lineWidth = 7;
                ctx.strokeStyle = '#050507';
                ctx.strokeText('DONIC', 0, 0);
                ctx.fillText('DONIC', 0, 0);

                ctx.font = 'bold 28px sans-serif';
                ctx.fillText('®', 295, -45);
                ctx.restore();

                ctx.save();
                ctx.translate(580, 196);
                ctx.font = '900 64px "Arial Black", Impact, Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#dc2626';
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#dc2626';
                ctx.strokeText('•S•T•R•E•S•S•', 0, 0);
                ctx.fillText('•S•T•R•E•S•S•', 0, 0);
                ctx.restore();

                ctx.save();
                ctx.fillStyle = '#dc2626';
                const stripeW = 76;
                const stripeGap = 76;
                const stripeH = 76;
                const startY = 244;
                const slantX = -(stripeH * (canvas_dx / canvas_dy));

                const outerStripeTopRight = xOuter - ((startY - yDonic) / canvas_dy) * canvas_dx;

                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const topRight = outerStripeTopRight - i * (stripeW + stripeGap);
                    const topLeft = topRight - stripeW;
                    ctx.moveTo(topLeft, startY);
                    ctx.lineTo(topRight, startY);
                    ctx.lineTo(topRight + slantX, startY + stripeH);
                    ctx.lineTo(topLeft + slantX, startY + stripeH);
                    ctx.closePath();
                }
                ctx.fill();
                ctx.restore();

                return tex;
            }

                ctx.font = 'bold 28px sans-serif';

                ctx.translate(444, 196);
                ctx.font = '900 64px "Arial Black", Impact, Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#dc2626';
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#dc2626';
                ctx.strokeText('•S•T•R•E•S•S•', 0, 0);

                ctx.restore();

                ctx.save();

                const stripeW = 76;
                const stripeGap = 76;
                const stripeH = 76;
                const startY = 244;
                const slantX = +(stripeH * (canvas_dx / canvas_dy));
                const outerStripeTopLeft = xOuter + ((startY - yDonic) / canvas_dy) * canvas_dx;

                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const topLeft = outerStripeTopLeft + i * (stripeW + stripeGap);
                    const topRight = topLeft + stripeW;
                    ctx.moveTo(topLeft, startY);
                    ctx.lineTo(topRight, startY);
                    ctx.lineTo(topRight + slantX, startY + stripeH);
                    ctx.lineTo(topLeft + slantX, startY + stripeH);
                    ctx.closePath();
                }
                ctx.fill();
                ctx.restore();

                return tex;

            function makeWoodFloorTexture() {
                const c = document.createElement('canvas');
                c.width = 2048;
                c.height = 2048;
                const ctx = c.getContext('2d');
                const tex = new THREE.CanvasTexture(c);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(6, 4);
                tex.anisotropy = 8;
                if (!ctx) return tex;

                const woodColors = [
                    '#7a5228', '#6b451f', '#5e3c1a', '#724b23',
                    '#66411d', '#583616', '#754d25', '#633e1c',
                    '#533214', '#6c4620', '#503013', '#734c24',
                    '#5c3a19', '#67421e', '#523114',
                ];

                const plankWidth = 32;
                const numColumns = Math.ceil(c.width / plankWidth);

                for (let col = 0; col < numColumns; col++) {
                    const colX = col * plankWidth;
                    let currentY = 0;
                    let segIndex = 0;
                    while (currentY < c.height) {
                        const segH = Math.min(c.height - currentY, 200 + ((col * 37 + segIndex * 89) % 280));
                        const colorIdx = (col * 7 + segIndex * 13 + ((col * 11) % 5)) % woodColors.length;
                        ctx.fillStyle = woodColors[colorIdx];
                        ctx.fillRect(colX, currentY, plankWidth, segH);

                        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                        ctx.fillRect(colX + 6, currentY, 1.2, segH);
                        ctx.fillRect(colX + 18, currentY, 1.2, segH);
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                        ctx.fillRect(colX + 12, currentY, 1.2, segH);
                        ctx.fillRect(colX + 24, currentY, 1.2, segH);
                        ctx.fillStyle = 'rgba(25, 12, 4, 0.45)';
                        ctx.fillRect(colX, currentY, plankWidth, 1.5);

                        currentY += segH;
                        segIndex++;
                    }
                    ctx.fillStyle = 'rgba(25, 12, 4, 0.38)';
                    ctx.fillRect(colX + plankWidth - 1, 0, 1.2, c.height);
                }

                return tex;
            }

            function makePostTexture() {
                const c = document.createElement('canvas');

                frontGrad.addColorStop(0.72, '#d4dce6');
                frontGrad.addColorStop(0.88, '#9ba7b6');
                frontGrad.addColorStop(1.00, '#788494');
                ctx.fillStyle = frontGrad;
                ctx.fillRect(128, 0, 256, c.height);

                const rearGrad1 = ctx.createLinearGradient(384, 0, 512, 0);
                rearGrad1.addColorStop(0.0, '#788494');
                rearGrad1.addColorStop(0.4, '#c0cad6');
                rearGrad1.addColorStop(0.85, '#f8fafc');
                rearGrad1.addColorStop(1.0, '#ffffff');
                ctx.fillStyle = rearGrad1;
                ctx.fillRect(384, 0, 128, c.height);

                const rearGrad2 = ctx.createLinearGradient(0, 0, 128, 0);
                rearGrad2.addColorStop(0.0, '#ffffff');
                rearGrad2.addColorStop(0.15, '#f8fafc');
                rearGrad2.addColorStop(0.6, '#c0cad6');
                rearGrad2.addColorStop(1.0, '#788494');
                ctx.fillStyle = rearGrad2;
                ctx.fillRect(0, 0, 128, c.height);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
                for (let y = 2; y < c.height; y += 4) ctx.fillRect(0, y, c.width, 1);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.05)';

                ctx.fillStyle = topShadow;
                ctx.fillRect(0, 0, c.width, 32);

                const botShadow = ctx.createLinearGradient(0, c.height - 48, 0, c.height);
                botShadow.addColorStop(0, 'rgba(15, 23, 42, 0)');
                botShadow.addColorStop(1, 'rgba(15, 23, 42, 0.40)');
                ctx.fillStyle = botShadow;
                ctx.fillRect(0, c.height - 48, c.width, 48);

                return tex;
            }

            const tableGeo = new THREE.BoxGeometry(1, TOP_THICK, TABLE_LEN, 1, 1, 1);
            const pos = tableGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);
                pos.setX(i, x * getW(z));

            pos.needsUpdate = true;
            tableGeo.computeVertexNormals();

            const sideMat = new THREE.MeshStandardMaterial({ color: 0x040e22, roughness: 0.45, metalness: 0.05, dithering: true });

            const tableMaterials = [
                sideMat, sideMat, topMat, botMat, edgeWhiteMat, edgeWhiteMat
            ];
            const tableTop = new THREE.Mesh(tableGeo, tableMaterials);
            tableTop.position.set(0, TABLE_H - TOP_THICK / 2, 0);
            tableTop.castShadow = true;
            tableTop.receiveShadow = false;
            scene.add(tableTop);

            const lineMat = new THREE.MeshStandardMaterial({
                color: 0xf8fafc,
                roughness: 0.25,
                polygonOffset: true,
                polygonOffsetFactor: -2,
                polygonOffsetUnits: -2,
                side: THREE.DoubleSide
            });

            const LINE_W = 0.02;
            const CENTER_W_NEAR = 0.009;
            const CENTER_W_FAR = 0.003;
            const zNear = -TABLE_LEN / 2;
            const zFar = TABLE_LEN / 2;
            const lineY = TABLE_H + 0.0004;

            const linePositions = [];
            function addQuad(x0, z0, x1, z1, x2, z2, x3, z3) {
                linePositions.push(x0, lineY, z0,  x1, lineY, z1,  x2, lineY, z2);
                linePositions.push(x0, lineY, z0,  x2, lineY, z2,  x3, lineY, z3);
            }

            addQuad(-W_NEAR / 2, zNear, -W_NEAR / 2 + LINE_W, zNear, -W_FAR / 2 + LINE_W, zFar, -W_FAR / 2, zFar);
            addQuad(W_NEAR / 2 - LINE_W, zNear, W_NEAR / 2, zNear, W_FAR / 2, zFar, W_FAR / 2 - LINE_W, zFar);
            addQuad(-W_NEAR / 2, zNear, W_NEAR / 2, zNear, W_NEAR / 2, zNear + LINE_W, -W_NEAR / 2, zNear + LINE_W);
            addQuad(-W_FAR / 2, zFar - LINE_W, W_FAR / 2, zFar - LINE_W, W_FAR / 2, zFar, -W_FAR / 2, zFar);
            addQuad(-CENTER_W_NEAR / 2, zNear, CENTER_W_NEAR / 2, zNear, CENTER_W_FAR / 2, zFar, -CENTER_W_FAR / 2, zFar);

            const linesGeo = new THREE.BufferGeometry();
            linesGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            linesGeo.computeVertexNormals();
            const linesMesh = new THREE.Mesh(linesGeo, lineMat);
            scene.add(linesMesh);

            const apronMat = new THREE.MeshStandardMaterial({ color: 0x070b14, metalness: 0.6, roughness: 0.35 });

            const playerApronGeo = new THREE.BoxGeometry(W_NEAR - 0.08, 0.05, 0.025);

            const oppApronGeo = new THREE.BoxGeometry(W_FAR - 0.08, 0.05, 0.025);
            const oppApron = new THREE.Mesh(oppApronGeo, apronMat);
            oppApron.position.set(0, TABLE_H - TOP_THICK - 0.025, TABLE_LEN / 2 - 0.03);
            scene.add(oppApron);

            const legMat = new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.75, roughness: 0.3 });
            const legGeo = new THREE.BoxGeometry(0.045, TABLE_H - TOP_THICK, 0.045);
            const lz = TABLE_LEN / 2 - 0.28;
            const lx_near = getW(-lz) / 2 - 0.14;
            const lx_far = getW(lz) / 2 - 0.14;

            [[-lx_near, -lz], [lx_near, -lz], [-lx_far, lz], [lx_far, lz]].forEach(([x, z]) => {
                const leg = new THREE.Mesh(legGeo, legMat);
                leg.position.set(x, (TABLE_H - TOP_THICK) / 2, z);
                leg.castShadow = true;
                scene.add(leg);

            const netMat = new THREE.MeshStandardMaterial({
                map: makeNetTexture(),

                alphaTest: 0.1,
                side: THREE.DoubleSide,
                roughness: 0.9,
                depthWrite: true
            });

            const ballCanvas = document.createElement('canvas');
            ballCanvas.width = 512;

            const ballCtx = ballCanvas.getContext('2d');

            function drawWarpedButtonGraphics(offsetY = 0) {
                ballCtx.clearRect(0, 0, 512, 1024);
                ballCtx.fillStyle = '#fce5cd'; // Card background color
                ballCtx.fillRect(0, 0, 512, 1024);
                
            const buttons = [
            { text: 'Preview Mode', bg: '#6abf6e', y: 200 },
            { text: 'Copy Preview URL', bg: '#a048a0', y: 400 },
            { text: 'Edit Mode', bg: '#e87070', y: 600 },
            { text: 'Portal Hub', bg: '#3ba8d6', y: 800 }
        ];

        buttons.forEach(btn => {
            ballCtx.save();
            let currentY = (btn.y + offsetY * 1024) % 1024;
            if (currentY < 0) currentY += 1024;

            // Move to center of drawing layer
            ballCtx.translate(256, currentY);

            // --- FIX STRETCHING MATH ---
            const distFromCenter = Math.abs(currentY - 512) / 512;
            const scaleX = 0.42 + (distFromCenter * distFromCenter * 0.35);
            ballCtx.scale(scaleX, 1.0);

            // Draw the button body pill shape
            ballCtx.fillStyle = btn.bg;
            ballCtx.beginPath();
            ballCtx.roundRect(-220, -35, 440, 70, 14);
            ballCtx.fill();

            // Render text label string sharp
            ballCtx.fillStyle = '#000000';
            ballCtx.font = 'bold 26px sans-serif';
            ballCtx.textAlign = 'center';
            ballCtx.textBaseline = 'middle';
            ballCtx.fillText(btn.text, 0, 0);
            ballCtx.restore();
        });
    }

            drawWarpedButtonGraphics(0);

            // Create the unique ball texture mapping
            const ballButtonTexture = new THREE.CanvasTexture(ballCanvas);
            ballButtonTexture.wrapS = THREE.RepeatWrapping; 
            ballButtonTexture.wrapT = THREE.RepeatWrapping; 

            const ballMaterial = new THREE.MeshStandardMaterial({
                map: ballButtonTexture,
                transparent: true,
                depthWrite: true,
                depthTest: true,
                roughness: 0.25,
                metalness: 0.1
            });

            // Standard ping-pong size metrics (~0.02m radius geometry scale)
            const pingPongBallGeo = new THREE.SphereGeometry(0.50, 64, 64);
            const pingPongBallMesh = new THREE.Mesh(pingPongBallGeo, ballMaterial);
            pingPongBallMesh.castShadow = true;
            pingPongBallMesh.renderOrder = 9999;
            ballMaterial.depthTest = false;
            pingPongBallMesh.position.set(0, TABLE_H + 0.50, 0); 

            // Physically inject it into your active 3D universe
            scene.add(pingPongBallMesh);
            // -------------------------------------------------------------
            
            const logoCanvas = document.createElement('canvas');
            logoCanvas.width = 512;
            logoCanvas.height = 512;
            const logoCtx = logoCanvas.getContext('2d');
            logoCtx.fillStyle = '#ffcc00';
            logoCtx.fillRect(0, 0, 512, 512);
            logoCtx.fillStyle = '#000000';
            logoCtx.font = 'bold 48px sans-serif';
            logoCtx.textAlign = 'center';
            logoCtx.fillText('PORTAL LOGO', 256, 256);
            
            const logoTexture = new THREE.CanvasTexture(logoCanvas);
            logoTexture.wrapT = THREE.RepeatWrapping;
            const netMesh = new THREE.Mesh(new THREE.PlaneGeometry(NET_LEN, NET_H), netMat);
            netMesh.position.set(0, TABLE_H + NET_H / 2, NET_Z);
            netMesh.castShadow = true;
            netMesh.renderOrder = 1;
            scene.add(netMesh);

            const cordMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.003, 0.003, NET_LEN, 12),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
            );
            cordMesh.rotation.z = Math.PI / 2;
            cordMesh.position.set(0, TABLE_H + NET_H, NET_Z);
            scene.add(cordMesh);

            const silverMat = new THREE.MeshStandardMaterial({
                color: 0xf1f5f9,
                metalness: 0.55,
                roughness: 0.22,
            });
            const blackPolymerMat = new THREE.MeshStandardMaterial({
                color: 0x18181b,
                metalness: 0.12,
                roughness: 0.55,
            });
            const steelMat = new THREE.MeshStandardMaterial({
                color: 0xe2e8f0,
                metalness: 0.92,
                roughness: 0.18,
            });
            const clampPadMat = new THREE.MeshStandardMaterial({
                color: 0x09090b,
                roughness: 0.85,
            });

            const donicBadgeMat = new THREE.MeshStandardMaterial({
                map: makeDonicStressTexture(),
                roughness: 0.25,
                metalness: 0.20,
                transparent: true,
                side: THREE.FrontSide,
                polygonOffset: true,
                polygonOffsetFactor: -12,
                polygonOffsetUnits: -12,
            });
            const donicBadgeMatRight = new THREE.MeshStandardMaterial({
                map: makeDonicStressTextureRight(),
                roughness: 0.25,
                metalness: 0.20,
                transparent: true,
                side: THREE.FrontSide,
                polygonOffset: true,
                polygonOffsetFactor: -12,
                polygonOffsetUnits: -12,
            });
            const postMat = new THREE.MeshStandardMaterial({
                map: makePostTexture(),
                roughness: 0.22,
                metalness: 0.45,
            });

            const postH = NET_H + 0.013;
            const postCenterY = TABLE_H + (NET_H - 0.007) / 2;

            const badgeW = 0.216;
            const badgeH = 0.069;

            const rightBadgeGeo = new THREE.BufferGeometry();
            rightBadgeGeo.setAttribute(
                'position',
                new THREE.BufferAttribute(
                    new Float32Array([
                        -badgeW / 2, -badgeH / 2, 0,
                        -badgeW / 2,  badgeH / 2, 0,
                         badgeW / 2,  badgeH / 2, 0,
                        -badgeW / 2, -badgeH / 2, 0,
                         badgeW / 2,  badgeH / 2, 0,
                         badgeW / 2, -badgeH / 2, 0,
                    ]),
                    3
                )
            );
            rightBadgeGeo.setAttribute(
                'uv',
                new THREE.BufferAttribute(
                    new Float32Array([
                        1, 0,
                        1, 1,
                        0, 1,
                        1, 0,
                        0, 1,
                        0, 0,
                    ]),
                    2
                )
            );
            rightBadgeGeo.computeVertexNormals();

            [-1, 1].forEach((sign) => {
                const tableEdgeX = sign * (W_AT_NET / 2);
                const px = sign * (W_AT_NET / 2 + NET_OVERHANG);

                const yTop = TABLE_H + 0.015;
                const yDonicMid = TABLE_H - 0.006;
                const dySlope = 0.048;
                const yBottom = yDonicMid - dySlope;
                const xInner = tableEdgeX - sign * 0.048;
                const xOuter = px + sign * 0.008;

                const runX = dySlope / TAN_40;
                const xSlopeEnd = xOuter - sign * runX;
                const cornerR = 0.012;

                const rubberPad = new THREE.Mesh(new THREE.BoxGeometry(0.046, 0.0025, 0.065), clampPadMat);
                rubberPad.position.set(tableEdgeX - sign * 0.024, TABLE_H + 0.0012, NET_Z);
                scene.add(rubberPad);

                const armShape = new THREE.Shape();
                if (sign === 1) {
                    armShape.moveTo(xInner, yBottom);
                    armShape.lineTo(xInner, yTop - cornerR);
                    armShape.quadraticCurveTo(xInner, yTop, xInner + cornerR, yTop);
                    armShape.lineTo(xOuter, yTop);
                    armShape.lineTo(xOuter, yDonicMid);
                    armShape.lineTo(xSlopeEnd, yBottom);
                    armShape.closePath();
                } else {
                    armShape.moveTo(xInner, yBottom);
                    armShape.lineTo(xInner, yTop - cornerR);
                    armShape.quadraticCurveTo(xInner, yTop, xInner - cornerR, yTop);
                    armShape.lineTo(xOuter, yTop);
                    armShape.lineTo(xOuter, yDonicMid);
                    armShape.lineTo(xSlopeEnd, yBottom);
                    armShape.closePath();
                }

                const armExtrudeGeo = new THREE.ExtrudeGeometry(armShape, {
                    steps: 1,
                    depth: 0.034,
                    bevelEnabled: true,
                    bevelThickness: 0.002,
                    bevelSize: 0.002,
                    bevelSegments: 2,
                });
                armExtrudeGeo.translate(0, 0, NET_Z - 0.017);
                const armMesh = new THREE.Mesh(armExtrudeGeo, silverMat);
                armMesh.castShadow = true;
                scene.add(armMesh);

                const armCenterX = (xInner + xOuter) / 2;
                const armCenterY = (yTop + yBottom) / 2;

                const badgeMat = sign === 1 ? donicBadgeMatRight : donicBadgeMat;
                const frontBadge = new THREE.Mesh(rightBadgeGeo, badgeMat);
                frontBadge.position.set(armCenterX, armCenterY, NET_Z - 0.021);
                frontBadge.rotation.x = -0.20;
                frontBadge.renderOrder = 999;
                scene.add(frontBadge);

                const heightRod = new THREE.Mesh(new THREE.CylinderGeometry(0.0055, 0.0055, 0.024, 16), steelMat);
                heightRod.position.set(px, TABLE_H - 0.024, NET_Z);
                scene.add(heightRod);

                const heightKnob = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.016, 0.018, 24), blackPolymerMat);
                heightKnob.position.set(px, TABLE_H - 0.040, NET_Z);
                scene.add(heightKnob);

                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, postH, 32), postMat);
                post.position.set(px, postCenterY, NET_Z);
                post.castShadow = true;
                scene.add(post);

                const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.0115, 0.0115, 0.004, 32), blackPolymerMat);
                cap.position.set(px, TABLE_H + NET_H + 0.005, NET_Z);
                scene.add(cap);

                const baseCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.020, 24), silverMat);
                baseCollar.position.set(px, TABLE_H - 0.010, NET_Z);
                scene.add(baseCollar);
            });

            const woodFloorTex = makeWoodFloorTexture();
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(40, 36),
                new THREE.MeshStandardMaterial({ map: woodFloorTex, roughness: 0.38, metalness: 0.02 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, 0, -1);
            floor.receiveShadow = true;
            scene.add(floor);

            const BACK_WALL_Z = 8.5;
            const wall = new THREE.Mesh(
                new THREE.PlaneGeometry(50, 16),
                new THREE.MeshStandardMaterial({ color: bgHex, roughness: 0.88, metalness: 0.02, side: THREE.DoubleSide })
            );
            wall.position.set(0, 8.0, BACK_WALL_Z);
            wall.rotation.set(0, 0, 0);
            scene.add(wall);

            const baseboardH = 0.20;
            const baseboard = new THREE.Mesh(
                new THREE.BoxGeometry(50, baseboardH, 0.04),
                new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.30, metalness: 0.10 })
            );
            baseboard.position.set(0, baseboardH / 2, BACK_WALL_Z - 0.02);
            scene.add(baseboard);

            function render() {
                renderer.render(scene, camera);
            }

            function autoSize() {
                const vW = window.innerWidth;
                const vH = window.innerHeight;
                const isPortrait = vH > vW;

                if (isPortrait) {
                    camera.position.set(0, TABLE_H + 0.58, -TABLE_LEN / 2 - 1.12);
                    camera.lookAt(0, TABLE_H - 0.20, 0.26);

                    const SQUISH_LENS = 1.03;
                    const aspect = (vW / vH) * SQUISH_LENS;

                    camera.updateMatrixWorld(true);

                    const postOuterX = W_AT_NET / 2 + NET_OVERHANG + 0.015;
                    const rightPostWorld = new THREE.Vector3(postOuterX, postCenterY, NET_Z);
                    const rightPostCam = rightPostWorld.clone().applyMatrix4(camera.matrixWorldInverse);

                    const desiredPostPx = (vW / 2) - 16;
                    const xRatio = Math.abs(rightPostCam.x / -rightPostCam.z);

                    const tanHalfH = (xRatio * (vW / 2)) / desiredPostPx;
                    const tanHalfV = tanHalfH / aspect;
                    camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(tanHalfV));

                    camera.aspect = vW / vH;
                    camera.updateProjectionMatrix();
                    renderer.setSize(vW, vH);

                    container.style.width = vW + 'px';
                    container.style.height = vH + 'px';
                    container.style.left = '50%';
                    container.style.transform = 'translateX(-50%)';
                } else {
                    camera.position.set(0, TABLE_H + 0.42, -TABLE_LEN / 2 - 0.72);
                    camera.lookAt(0, TABLE_H - 0.01, 0.32);

                    camera.updateMatrixWorld(true);

                    const postOuterX = W_AT_NET / 2 + NET_OVERHANG + 0.015;
                    const rightPostWorld = new THREE.Vector3(postOuterX, postCenterY, NET_Z);
                    const rightPostCam = rightPostWorld.clone().applyMatrix4(camera.matrixWorldInverse);

                    camera.fov = 64;
                    const halfFovRad = THREE.MathUtils.degToRad(camera.fov / 2);
                    const postPxFromCenter = Math.abs(rightPostCam.x / (-rightPostCam.z * Math.tan(halfFovRad))) * (vH / 2);
                    const exactCropWidth = Math.round((postPxFromCenter + 25) * 2);
                    const finalWidth = Math.min(vW, exactCropWidth);

                    container.style.width = finalWidth + 'px';
                    container.style.height = vH + 'px';
                    container.style.left = '50%';
                    container.style.transform = 'translateX(-50%)';

                    camera.aspect = finalWidth / vH;
                    camera.updateProjectionMatrix();
                    renderer.setSize(finalWidth, vH);
                }

                render();
            }

            autoSize();
            window.addEventListener('resize', autoSize);
            window.addEventListener('orientationchange', () => {
                setTimeout(autoSize, 120);
            });

            // =========================================================================
            // FRAME CONTROLLER: 0 (100%), 1 to 2 (Zero background), 3 to 20 (Background revealed)
            // =========================================================================
            let activeFrame = 0;
            window.activeFrame = 0; // Expose globally for PTR logic

            const scrubHint = document.getElementById('scrub-hint');

            function applyFrame(frameNum) {
                activeFrame = Math.max(0, Math.min(20, frameNum));
                window.activeFrame = activeFrame;

                const ballLayer = document.getElementById('ball-layer');
                const card = document.querySelector('.card');
                const container = document.getElementById('canvas-container');

                if (!card || !container || !ballLayer) return;

                if (activeFrame === 0) {
                    // Frame 0: Original 100% portal page
                    container.style.display = 'none';
                    ballLayer.style.display = 'block'; 
                    ballLayer.style.clipPath = 'circle(100vmax at 50% 50%)';
                    card.style.transform = 'scale(1) translateY(0px)';
                    container.style.width = '';
                    container.style.left = '';
                    container.style.transform = '';
                    if (scrubHint) scrubHint.textContent = "Frame: 0 (Original 100%) | Scroll Down for Frame 1";
                } else if (activeFrame >= 1 && activeFrame <= 20) {
                    // --- FIXED: ALLOW ALL FRAMES 1-20 TO COMPLY WITH THE 3D BALL CONTAINER ---
                    container.style.display = 'block'; 
                    ballLayer.style.display = 'none'; 
    
                    autoSize(); // Synchronize view matrices instantly
    
                    const scale = 1.0 - (activeFrame * 0.04);
                    const yOffset = -(activeFrame * 24);
                    card.style.transform = `translateX(-50%) scale(${scale.toFixed(2)}) translateY(${yOffset}px)`;
                    if (scrubHint) scrubHint.textContent = `Frame: ${activeFrame} | 3D Ball Active`;
                }
                
                // ============================================================
                // 🚀 FULL 20-FRAME POSITIONING & DIMENSION MORPHING PIPELINE
                // ============================================================
                // Ensure frame references scale across a full 20-frame count array
                const targetMaxFrames = 20; 
                const currentProgress = activeFrame / targetMaxFrames;

                if (activeFrame >= 1 && activeFrame <= targetMaxFrames) {
                    // Normalize a factor baseline spanning from frame 1 up to frame 20
                    const progressFactor = (activeFrame - 1) / (targetMaxFrames - 1); 
                    
                    // Smoothly scale the ball size down from a large 1.6 down to a centered 0.4
                    const currentScale = THREE.MathUtils.lerp(1.6, 0.4, progressFactor);
                    pingPongBallMesh.scale.set(currentScale, currentScale, currentScale);

                    // Track camera focal vectors
                    const targetDirection = new THREE.Vector3();
                    camera.getWorldDirection(targetDirection);

                    // Frame 1 sits flush near the lens. Frame 20 pulls deep back over the table space
                    const distanceFactor = THREE.MathUtils.lerp(1.15, 3.2, progressFactor);
                    pingPongBallMesh.position.copy(camera.position)
                        .addScaledVector(targetDirection, distanceFactor);

                    // Dynamic Texture morphing parameters to maintain crisp flat layout vectors on Frame 1
                    let depthFactor = 1.0;
                    if (activeFrame === 1) {
                        depthFactor = 0.001; // Squash depth completely flat on Frame 1 for zero texture warping
                        ballButtonTexture.repeat.set(1.0, 1.0);
                        ballButtonTexture.offset.x = 0.0;
                    } else if (activeFrame === 2) {
                        depthFactor = 0.35;  // Frame 2: Start expanding out volumetric depth curves
                        ballButtonTexture.repeat.set(2.0, 1.0);
                        ballButtonTexture.offset.x = 0.125;
                    } else {
                        // Frame 3 to 20: Fully continuous spherical lock properties
                        depthFactor = 1.0;
                        ballButtonTexture.repeat.set(4.0, 1.0);
                        ballButtonTexture.offset.x = 0.375;
                    }
                    pingPongBallMesh.scale.z *= depthFactor;
                } else {
                    // Fallback for frames 21+
                    pingPongBallMesh.scale.set(1.0, 1.0, 1.0);
                }

                // Global Top-Spin Texture Offsets
                logoTexture.offset.y = currentProgress;
                drawWarpedButtonGraphics(currentProgress);
                ballButtonTexture.needsUpdate = true;

                render();

            }

            const copyPreviewBtn = document.getElementById('copy-preview-btn');
            if (copyPreviewBtn) {
                copyPreviewBtn.addEventListener('click', () => {
                    applyFrame(1);
                    if (scrubHint) scrubHint.style.display = 'block';
                });
            }

            window.addEventListener('wheel', (e) => {
                if (scrubHint && scrubHint.style.display === 'block') {
                    e.preventDefault();
                    if (e.deltaY > 0) {
                        applyFrame(activeFrame + 1);
                    } else {
                        applyFrame(activeFrame - 1);
                    }
                }
            }, { passive: false });

            window.addEventListener('keydown', (e) => {
                if (scrubHint && scrubHint.style.display === 'block') {
                    if (e.code === 'ArrowDown' || e.code === 'ArrowRight') {
                        applyFrame(activeFrame + 1);
                    } else if (e.code === 'ArrowUp' || e.code === 'ArrowLeft') {
                        applyFrame(activeFrame - 1);
                    }
                }
            });

            // Touch Swipe Scrubbing (Only active when exploring frames)
            let scrubStartY = 0;
            window.addEventListener('touchstart', (e) => {
                if (activeFrame > 0 && e.touches.length === 1) {
                    scrubStartY = e.touches[0].clientY;
                }
            }, {passive: false});

            window.addEventListener('touchmove', (e) => {
                if (activeFrame > 0 && scrubHint && scrubHint.style.display === 'block') {
                    e.preventDefault(); // Lock normal page scroll during animation inspection
                }
            }, {passive: false});

            window.addEventListener('touchend', (e) => {
                if (activeFrame > 0 && scrubHint && scrubHint.style.display === 'block') {
                    let dy = e.changedTouches[0].clientY - scrubStartY;
                    if (dy > 30) applyFrame(activeFrame - 1); // Swipe down = reverse
                    else if (dy < -30) applyFrame(activeFrame + 1); // Swipe up = forward
                }
            });

        })();

        // ============================================================================
        // 🔄 INTERACTION INGUN CONTROLLER WITH INGUN AUDIO SYNCHRONIZATION
        // ============================================================================
        // 1. Initialize your new audio asset at the top of the interaction block
         const ingunSound = new Audio('./IngunChant.m4a'); 

        let dragStartPointY = 0;
        let distanceSwipedY = 0;
        const sweepReloadThreshold = 85; 
        const ptrContainerObj = document.getElementById('ptr');

        function onPullInitiated(clientY) {
            if (typeof activeFrame !== 'undefined' && activeFrame === 0) {
                dragStartPointY = clientY;
            }
        }

        function onPullProgressing(clientY) {
            if (dragStartPointY === 0 || !ptrContainerObj) return;
    
            const calculatedDelta = clientY - dragStartPointY;
    
            if (calculatedDelta > 0) {
                distanceSwipedY = Math.min(calculatedDelta, sweepReloadThreshold + 20);
        
                ptrContainerObj.style.display = 'block';
                ptrContainerObj.style.transform = `translateY(${distanceSwipedY * 0.3}px)`;
                ptrContainerObj.style.opacity = Math.min(distanceSwipedY / sweepReloadThreshold, 1.0);
            } // ◄--- This closes your 'if' statement
        } // ◄--- This closes your 'onPullProgressing' function clean! (No extra bracket here anymore)

        function onPullTerminated() {
            if (!ptrContainerObj) return;

            if (distanceSwipedY >= sweepReloadThreshold) {
                // Threshold crossed: Start spinning
                ptrContainerObj.classList.add('spin');
                ptrContainerObj.style.opacity = '1.0';

                // --- SAFE LAZY AUDIO INTERFACE ---
                try {
                    const ingunSound = new Audio('ingun.m4a');
                    ingunSound.play().catch(err => console.log("Audio deferred: ", err));
                } catch(audioError) {
                    console.log("Audio skipped: ", audioError);
                }

                setTimeout(() => {
                    location.reload(true);
                }, 550);
            } else {
                ptrContainerObj.style.display = 'none';
                ptrContainerObj.classList.remove('spin');
            }
            dragStartPointY = 0;
            distanceSwipedY = 0;
        }

        // Event bindings remain exactly the same
        window.addEventListener('touchstart', (e) => onPullInitiated(e.touches.clientY), { passive: true });
        window.addEventListener('touchmove', (e) => onPullProgressing(e.touches.clientY), { passive: true });
        window.addEventListener('touchend', onPullTerminated);
        window.addEventListener('mousedown', (e) => onPullInitiated(e.clientY));
        window.addEventListener('mousemove', (e) => { if (e.buttons === 1) onPullProgressing(e.clientY); });
        window.addEventListener('mouseup', onPullTerminated);

    </script>
