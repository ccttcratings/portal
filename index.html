<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; text-align: center; padding: 40px 20px; margin: 0; }
    .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { color: #1e293b; margin-bottom: 8px; font-size: 22px; }
    p { color: #64748b; font-size: 14px; margin-bottom: 30px; }
    .btn { display: block; text-decoration: none; padding: 14px; margin: 12px 0; border-radius: 8px; font-weight: bold; font-size: 16px; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .preview { background-color: #1a73e8; color: white; }
    .edit { background-color: #10b981; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h2>View Mode Portal</h2>
    <p>Choose one:</p>
    <!-- REPLACE THE LINKS BELOW WITH YOUR GOOGLE SHEET LINKS -->
    <a href="https://docs.google.com/spreadsheets/d/1_Ou_wAKDovm5ASpc85cpGGbxKZcJkiEIEgifOE0ClBk/preview" class="btn preview">Preview Mode (works on most devices)</a>
    <a href="https://docs.google.com/spreadsheets/d/1_Ou_wAKDovm5ASpc85cpGGbxKZcJkiEIEgifOE0ClBk/edit?gid=2067557144#gid=2067557144" class="btn edit">Edit Mode (with white banner)</a>
  </div>
</body>
</html>
