<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>var p=new URLSearchParams(location.search);    if(p.has('neon')||(!p.has('normal')&&new Date().getDate()%2))document.documentElement.classList.add('neon')</script>
  <style>
    /* ----------------------------------------------------
       THE FIX: Intercept Dark Reader for the Blue Hub Button 
       NOTE: not using prefers-color-scheme — it follows the OS
       theme (which can be dark while nothing darkens the page),
       while this attribute only appears when Dark Reader is
       actually rendering the page dark.
       ---------------------------------------------------- */
    html[data-darkreader-scheme="dark"] .hub {
      background: linear-gradient(180deg, #3ba8d6 0%, #1a7daa 40%, #0e5f80 100%) !important;
      color: #000 !important;
    }

    /* Core Layout Styles */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fce5cd; text-align: center; padding: 8px 24px; margin: 0; }
    .card { background: #fce5cd; max-width: 400px; margin: 0 auto; padding: 6px 20px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { color: #000; margin-bottom: 42px; font-size: 30px; }
    p { color: #e07474; font-size: 16px; margin-bottom: 30px; }
    /* Glass Button Base - glossy gel + perspective angle */
    .btn {
      position: relative; display: block; text-decoration: none;
      padding: 14px; margin: 2px 0; border-radius: 12px;
      font-weight: bold; font-size: 20px; color: #000;
      transform: perspective(500px) rotateY(-12deg);
      box-shadow: 2px 0 0 4px rgba(0,0,0,.2), 0 6px 0 var(--dark), 0 10px 16px rgba(0,0,0,.35);
      overflow: hidden; border: none;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .btn::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.15) 100%);
      border-radius: 8px 8px 50% 50%; pointer-events: none;
    }
    .btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,.3), transparent);
      transition: 0.5s; z-index: 1; pointer-events: none;
    }
    .btn:hover::before { left: 100%; }
    .btn:hover { transform: perspective(500px) rotateY(0deg); box-shadow: 0 0 0 4px rgba(0,0,0,.1), 0 2px 0 var(--dark), 0 4px 10px rgba(0,0,0,.25); }
    .btn:active { transform: perspective(500px) rotateY(0deg) translateY(2px); box-shadow: 0 0 0 4px rgba(0,0,0,.1), 0 0 0 var(--dark), 0 2px 6px rgba(0,0,0,.2); }

    /* Glass Colors */
    .preview { background: linear-gradient(180deg, #6abf6e 0%, #3a9e3e 40%, #288028 100%); --dark: #1c6a1c; }
    .edit { background: linear-gradient(180deg, #e87070 0%, #c84040 40%, #a02020 100%); --dark: #801818; margin-top: 20px; margin-bottom: 2px; }
    .hub { background: linear-gradient(180deg, #3ba8d6 0%, #1a7daa 40%, #0e5f80 100%); --dark: #0a4a60; margin-top: 100px; }
    .copy-btn {
      position: relative; display: block; background: linear-gradient(180deg, #a048a0 0%, #883088 40%, #682068 100%);
      color: #000; font-size: 13px; font-weight: bold; padding: 16px 14px; margin: 20px 0 2px;
      border: none; border-radius: 8px; cursor: pointer; width: 100%; box-sizing: border-box;
      transform: perspective(500px) rotateY(-12deg);
      box-shadow: 1px 0 0 3px rgba(0,0,0,.15), 0 4px 0 #501850, 0 6px 10px rgba(0,0,0,.25);
      overflow: hidden; transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .copy-btn::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.15) 100%);
      border-radius: 6px 6px 50% 50%; pointer-events: none;
    }
    .copy-btn:hover { transform: perspective(500px) rotateY(0deg); box-shadow: 0 0 0 3px rgba(0,0,0,.08), 0 1px 0 #501850, 0 3px 8px rgba(0,0,0,.2); }
    .copy-btn:active { transform: perspective(500px) rotateY(0deg) translateY(2px); box-shadow: 0 0 0 3px rgba(0,0,0,.08), 0 0 0 #501850, 0 2px 4px rgba(0,0,0,.15); }
    .copy-btn.copied { background: linear-gradient(180deg, #a8c7a8 0%, #88b088 40%, #709870 100%); --dark: #5a805a; }
    
    .subtext { display: block; font-size: 12px; font-weight: normal; opacity: 0.8; margin-top: 4px; }

    /* Neon overrides — odd days */
    html.neon .preview { background: linear-gradient(180deg, #00ff00 0%, #00cc00 40%, #009900 100%); --dark: #006600; }
    html.neon .edit { background: linear-gradient(180deg, #ff0000 0%, #cc0000 40%, #990000 100%); --dark: #660000; }
    html.neon .hub { background: linear-gradient(180deg, #22eeff 0%, #00ccdd 40%, #00aabb 100%); --dark: #008899; }
    html.neon .copy-btn { background: linear-gradient(180deg, #bf00ff 0%, #9900dd 40%, #7700bb 100%); box-shadow: 1px 0 0 3px rgba(0,0,0,.15), 0 4px 0 #550099, 0 6px 10px rgba(0,0,0,.25); }
    html.neon .copy-btn:hover { box-shadow: 0 0 0 3px rgba(0,0,0,.08), 0 1px 0 #550099, 0 3px 8px rgba(0,0,0,.2); }
    html.neon .copy-btn:active { box-shadow: 0 0 0 3px rgba(0,0,0,.08), 0 0 0 #550099, 0 2px 4px rgba(0,0,0,.15); }
    html.neon .btn::after, html.neon .copy-btn::after {
      background: linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,.3) 100%) !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>View Mode Portal</h2>
    <a href="https://docs.google.com/spreadsheets/d/1_Ou_wAKDovm5ASpc85cpGGbxKZcJkiEIEgifOE0ClBk/preview" class="btn preview">Preview Mode <span class="subtext">(works on most devices)</span></a>
    <button class="copy-btn" data-label="Copy Preview Mode URL" onclick="copyUrl(this, previewUrl)">Copy Preview Mode URL</button>
    <a href="https://docs.google.com/spreadsheets/d/1_Ou_wAKDovm5ASpc85cpGGbxKZcJkiEIEgifOE0ClBk/edit?gid=2067557144#gid=2067557144" class="btn edit">Edit Mode <span class="subtext">(annoying banner at top)</span></a>
    <button class="copy-btn" data-label="Copy Edit Mode URL" onclick="copyUrl(this, editUrl)">Copy Edit Mode URL</button>
    <a href="https://ccttcratings.github.io/portalhub/" class="btn hub">Portal Hub of Portals<span class="subtext">(hub of redundant portals)</span></a>
  </div>
  <script>
    const previewUrl = "https://docs.google.com/spreadsheets/d/1_Ou_wAKDovm5ASpc85cpGGbxKZcJkiEIEgifOE0ClBk/preview";
    const editUrl = "https://docs.google.com/spreadsheets/d/1_Ou_wAKDovm5ASpc85cpGGbxKZcJkiEIEgifOE0ClBk/edit?gid=196901061#gid=196901061";
    function copyUrl(btn, url) {
      navigator.clipboard.writeText(url).then(() => {
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = btn.getAttribute("data-label");
          btn.classList.remove("copied");
        }, 2000);
      });
    }
  </script>
</body>
</html>
