    <title>View Mode Portal + Table Serve Animation</title>

    <meta name="color-scheme" content="dark">
    <script>
        var p = new URLSearchParams(location.search);
        if (p.has('neon') || (!p.has('normal') && new Date().getDate() % 2)) {
            document.documentElement.classList.add('neon');

    <style>
 * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            text-size-adjust: none;
            -webkit-text-size-adjust: none;
            -moz-text-size-adjust: none;   
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent; /* Handled by ball-layer and 3D canvas */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;              /* Overrides mobile gesture overrides */
            overscroll-behavior-y: contain; /* Prevents natural browser bounce loops */
        }

        button, input, select, textarea {
            font-family: inherit;
        }

        /* Three.js 3D Background Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100vh;
            overflow: hidden;
            display: none;
            z-index: 1;
        }

        /* Ball Wrapper: Creates the spherical boundary mask */
        #ball-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fce5cd;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: clip-path 0.15s linear, background-color 0.15s linear;
            clip-path: circle(100vmax at 50% 50%); /* Base state: covers screen fully */
        }

        html.neon #ball-layer {
            background-color: #4e2a05;
        }

        .ptr-fixed {

            left: 50%;
            width: 64px;
            height: 64px;
            margin-left: -32px;
            margin-top: -68px;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;         
            transition: opacity 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ptr-fixed {
            position: fixed !important;
        }

        #ptr-svg {
            position: absolute;
            width: 48px;
            height: 48px;
            top: 8px;
            left: 8px;
            transform: scale(2.4);
            transform-origin: center;
