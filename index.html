<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
var p = new URLSearchParams(location.search);
if (p.has('neon') || (!p.has('normal') && new Date().getDate() % 2)) {
    document.documentElement.classList.add('neon');
    document.documentElement.setAttribute('data-darkreader-scheme', 'dark');
}

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background: transparent; /* Allows 3D canvas to show through when mask shrinks */
    text-align:center;
    margin:0;
    touch-action:none;
    overflow: hidden;
}

button, input, select, textarea {
    font-family: inherit;
}

/* Three.js 3D Background Container */
#canvas-container {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 100vh;
    overflow: hidden;
    display: none;
    z-index: 1;
}

/* Ball Wrapper: Creates the spherical boundary mask and holds the portal card */
#ball-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #fce5cd;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
    transition: clip-path 0.15s linear, background-color 0.15s linear;
    clip-path: circle(150vh at 50% 50%); /* Base state: covers screen fully */
}

html.neon #ball-layer {
    background-color: #4e2a05;
}

/* PTR BOX 64×64 */
#ptr {
    position:fixed;
    top:0;
    left:50%;
    width:64px;
    height:64px;
    margin-left:-32px;
    margin-top:-68px;
    z-index:9999;
    pointer-events:none;
    opacity:1;
    transition:opacity .15s;
}

#ptr-svg {
    position:absolute;
    width:48px;
    height:48px;
    top:8px;
    left:8px;
    transform-origin:24px 24px;
    transform:scale(2.0);
}

#g79 { opacity:1; }
#ptr.spin #g79 { opacity:0; }

#ptr.spin #ptr-svg {
    animation:ptrSpin .7s linear infinite;
    transform:scale(2.0) rotate(0deg);
}

@keyframes ptrSpin {
    from { transform:scale(2.0) rotate(0deg); }
    to   { transform:scale(2.0) rotate(360deg); }
}

.card {
    background:#fce5cd;
    color-scheme: light;
    max-width:440px;
    width: 92%;
    margin:0 auto;
    padding:24px 28px 20px;
    border-radius:12px;
    position: relative;
    z-index: 10;
    /* Transition added for smooth scrolling between frames */
    transition: transform 0.15s linear;
    transform: scale(1) translateY(0px);
}

h2 { color:#000; margin-bottom:48px; font-size:30px; font-weight:800; display:block; }
p  { color:#e07474; font-size:16px; margin-bottom:30px; }

.btn {
    position:relative;
    display:block;
    width: 100%;
    text-decoration:none;
    padding:14px 16px;
    margin:4px 0;
    border-radius:12px;
    font-weight:bold;
    font-size:20px;
    color:#000;
    transform:perspective(500px) rotateY(-12deg);
    box-shadow:2px 0 0 4px rgba(0,0,0,.2),0 6px 0 var(--dark),0 10px 16px rgba(0,0,0,.35);
    overflow:hidden;
    border:none;
    cursor: pointer;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.btn::after {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:45%;
    background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.15));
    border-radius:8px 8px 50% 50%;
}

.btn::before {
    content:'';
    position:absolute;
    top:0; left:-100%;
    width:100%; height:100%;
    background:linear-gradient(to right,transparent,rgba(255,255,255,.3),transparent);
    transition:.5s;
    z-index:1;
}

.btn:hover::before { left:100%; }
.btn:hover {
    transform:perspective(500px) rotateY(0deg);
    transform-style: preserve-3d;
    box-shadow:0 0 0 4px rgba(0,0,0,.1),0 2px 0 var(--dark),0 4px 10px rgba(0,0,0,.25);
}

.copy-btn {
    position: relative; display: block; background: linear-gradient(180deg, #a048a0 0%, #883088 40%, #682068 100%);
    color: #000; font-size: 14px; font-weight: bold; padding: 14px 16px; margin: 16px 0 32px;
    border: none; border-radius: 10px; width: 100%; cursor: pointer;
    transform: perspective(500px) rotateY(-12deg);
    box-shadow: 1px 0 0 3px rgba(0,0,0,.15), 0 4px 0 #501850, 0 6px 10px rgba(0,0,0,.25);
    overflow: hidden; transition: transform 0.4s ease, box-shadow 0.4s ease;
}
.copy-btn::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
    background: linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.15) 100%);
    border-radius: 6px 6px 50% 50%; pointer-events: none;
}
.copy-btn:hover { transform: perspective(500px) rotateY(0deg); box-shadow: 0 0 0 3px rgba(0,0,0,.08), 0 1px 0 #501850, 0 3px 8px rgba(0,0,0,.2); }
.copy-btn:active { transform: perspective(500px) rotateY(0deg) translateY(2px); box-shadow: 0 0 0 3px rgba(0,0,0,.08), 0 0 0 #501850, 0 2px 4px rgba(0,0,0,.15); }
.copy-btn.copied { background: linear-gradient(180deg, #a8c7a8 0%, #88b088 40%, #709870 100%); --dark: #5a805a; }

.preview { background:linear-gradient(180deg,#6abf6e,#3a9e3e,#288028); --dark:#1c6a1c; }
.edit    { background:linear-gradient(180deg,#e87070,#c84040,#a02020); --dark:#801818; margin-top: 18px; margin-bottom: 4px; }
.hub     { background:linear-gradient(180deg,#3ba8d6,#1a7daa,#0e5f80); --dark:#0a4a60; margin-top: 80px; }

.subtext { display:block; font-size:12px; opacity:.8; margin-top:4px; }

html.neon .preview { background:linear-gradient(180deg,#00ff00,#00cc00,#009900); --dark:#006600; }
html.neon .edit    { background:linear-gradient(180deg,#ff0000,#cc0000,#990000); --dark:#660000; }
html.neon .hub     { background:linear-gradient(180deg,#0bcade,#09a3b5,#077c9c); --dark:#055f7d; }
html.neon .copy-btn { background: linear-gradient(180deg, #bf00ff 0%, #9900dd 40%, #7700bb 100%); box-shadow: 1px 0 0 3px rgba(0,0,0,.15), 0 4px 0 #550099, 0 6px 10px rgba(0,0,0,.25); }
html.neon body { background: #4e2a05; }
html.neon .card { background: #4e2a05; }
html.neon h2 { color: #fff !important; }
html.neon p { color: #ffb3b3; }

/* Frame Scrubber HUD */
#scrub-hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.90);
    color: #f8fafc;
    padding: 9px 22px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    z-index: 100;
    display: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

            setTimeout(function(){location.reload();},750);

        } else {
            ptr.style.marginTop='-68px';
            ptr.style.opacity=1;
            ptr.className='';
            ptrSvg.style.transform='scale(2.0)';
            if(g1) g1.style.transform='';
        }
        return;
    }

    var h=drag.history;
    if(h.length<2) return;
    var last=h[h.length-1], first=h[0];
    var dt=last.t-first.t;
    if(dt<=0) return;
    var velocity=(first.y-last.y)/dt;
    if(Math.abs(velocity)<0.3) return;

    startScrollMomentum(velocity);
},{passive:true});

function startScrollMomentum(v){
    drag.animating=true;
    var lastTime=Date.now();
    var vy=v;
    var layer = document.getElementById('ball-layer');

    function step(){
        if(!drag.animating) return;
        var now=Date.now();
        var elapsed=now-lastTime;
        lastTime=now;

        vy*=Math.pow(friction,elapsed/16);
        if(Math.abs(vy)<0.01){drag.animating=false;return;}

        var maxScroll=layer.scrollHeight-layer.clientHeight;
        var scroll=layer.scrollTop;
        var next=scroll+vy*elapsed;

        if(next<0){next=0;vy=-vy*bounceDecay;}
        else if(next>maxScroll){next=maxScroll;vy=-vy*bounceDecay;}

        layer.scrollTo(0,next);
        requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
}
})();
</script>

    const legGeo = new THREE.BoxGeometry(0.045, TABLE_H - TOP_THICK, 0.045);
    const lz = TABLE_LEN / 2 - 0.28;
    const lx_near = getW(-lz) / 2 - 0.14;
    const lx_far = getW(lz) / 2 - 0.14;

    [[-lx_near, -lz], [lx_near, -lz], [-lx_far, lz], [lx_far, lz]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(x, (TABLE_H - TOP_THICK) / 2, z);
        leg.castShadow = true;
        scene.add(leg);
    });

    const netMat = new THREE.MeshStandardMaterial({
        map: makeNetTexture(),
        transparent: true,
        alphaTest: 0.1,
        side: THREE.DoubleSide,
        roughness: 0.9,
        depthWrite: false
    });
    const netMesh = new THREE.Mesh(new THREE.PlaneGeometry(NET_LEN, NET_H), netMat);
    netMesh.position.set(0, TABLE_H + NET_H / 2, NET_Z);
    netMesh.castShadow = true;
    scene.add(netMesh);

    const cordMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.003, 0.003, NET_LEN, 12),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
    );
    cordMesh.rotation.z = Math.PI / 2;
    cordMesh.position.set(0, TABLE_H + NET_H, NET_Z);
    scene.add(cordMesh);

    const silverMat = new THREE.MeshStandardMaterial({
        color: 0xf1f5f9,
        metalness: 0.55,
        roughness: 0.22,
    });
    const blackPolymerMat = new THREE.MeshStandardMaterial({
        color: 0x18181b,
        metalness: 0.12,
        roughness: 0.55,
    });
    const steelMat = new THREE.MeshStandardMaterial({
        color: 0xe2e8f0,
        metalness: 0.92,
        roughness: 0.18,
    });
    const clampPadMat = new THREE.MeshStandardMaterial({
        color: 0x09090b,
        roughness: 0.85,
    });

    const donicBadgeMat = new THREE.MeshStandardMaterial({
        map: makeDonicStressTexture(),
        roughness: 0.25,
        metalness: 0.20,
        transparent: true,
        side: THREE.FrontSide,
        polygonOffset: true,
        polygonOffsetFactor: -12,
        polygonOffsetUnits: -12,
    });
    const donicBadgeMatRight = new THREE.MeshStandardMaterial({
        map: makeDonicStressTextureRight(),
        roughness: 0.25,
        metalness: 0.20,
        transparent: true,
        side: THREE.FrontSide,
        polygonOffset: true,
        polygonOffsetFactor: -12,
        polygonOffsetUnits: -12,
    });
    const postMat = new THREE.MeshStandardMaterial({
        map: makePostTexture(),
        roughness: 0.22,
        metalness: 0.45,
    });

    const postH = NET_H + 0.013;
    const postCenterY = TABLE_H + (NET_H - 0.007) / 2;

    const badgeW = 0.216;
    const badgeH = 0.069;

    const rightBadgeGeo = new THREE.BufferGeometry();
    rightBadgeGeo.setAttribute(
        'position',
        new THREE.BufferAttribute(
            new Float32Array([
                -badgeW / 2, -badgeH / 2, 0,
                -badgeW / 2,  badgeH / 2, 0,
                 badgeW / 2,  badgeH / 2, 0,
                -badgeW / 2, -badgeH / 2, 0,
                 badgeW / 2,  badgeH / 2, 0,
                 badgeW / 2, -badgeH / 2, 0,
            ]),
            3
        )
    );
    rightBadgeGeo.setAttribute(
        'uv',
        new THREE.BufferAttribute(
            new Float32Array([
                1, 0,
                1, 1,
                0, 1,
                1, 0,
                0, 1,
                0, 0,
            ]),
            2
        )
    );
    rightBadgeGeo.computeVertexNormals();

    [-1, 1].forEach((sign) => {
        const tableEdgeX = sign * (W_AT_NET / 2);
        const px = sign * (W_AT_NET / 2 + NET_OVERHANG);

        const yTop = TABLE_H + 0.015;
        const yDonicMid = TABLE_H - 0.006;
        const dySlope = 0.048;
        const yBottom = yDonicMid - dySlope;
        const xInner = tableEdgeX - sign * 0.048;
        const xOuter = px + sign * 0.008;

        const runX = dySlope / TAN_40;
        const xSlopeEnd = xOuter - sign * runX;
        const cornerR = 0.012;

        const rubberPad = new THREE.Mesh(new THREE.BoxGeometry(0.046, 0.0025, 0.065), clampPadMat);
        rubberPad.position.set(tableEdgeX - sign * 0.024, TABLE_H + 0.0012, NET_Z);
        scene.add(rubberPad);

        const armShape = new THREE.Shape();
        if (sign === 1) {
            armShape.moveTo(xInner, yBottom);
            armShape.lineTo(xInner, yTop - cornerR);
            armShape.quadraticCurveTo(xInner, yTop, xInner + cornerR, yTop);
            armShape.lineTo(xOuter, yTop);
            armShape.lineTo(xOuter, yDonicMid);
            armShape.lineTo(xSlopeEnd, yBottom);
            armShape.closePath();
        } else {
            armShape.moveTo(xInner, yBottom);
            armShape.lineTo(xInner, yTop - cornerR);
            armShape.quadraticCurveTo(xInner, yTop, xInner - cornerR, yTop);
            armShape.lineTo(xOuter, yTop);
            armShape.lineTo(xOuter, yDonicMid);
            armShape.lineTo(xSlopeEnd, yBottom);
            armShape.closePath();
        }

        const armExtrudeGeo = new THREE.ExtrudeGeometry(armShape, {
            steps: 1,
            depth: 0.034,
            bevelEnabled: true,
            bevelThickness: 0.002,
            bevelSize: 0.002,
            bevelSegments: 2,
        });
        armExtrudeGeo.translate(0, 0, NET_Z - 0.017);
        const armMesh = new THREE.Mesh(armExtrudeGeo, silverMat);
        armMesh.castShadow = true;
        scene.add(armMesh);

        const armCenterX = (xInner + xOuter) / 2;
        const armCenterY = (yTop + yBottom) / 2;

        const badgeMat = sign === 1 ? donicBadgeMatRight : donicBadgeMat;
        const frontBadge = new THREE.Mesh(rightBadgeGeo, badgeMat);
        frontBadge.position.set(armCenterX, armCenterY, NET_Z - 0.021);
        frontBadge.rotation.x = -0.20;
        frontBadge.renderOrder = 999;
        scene.add(frontBadge);

        const heightRod = new THREE.Mesh(new THREE.CylinderGeometry(0.0055, 0.0055, 0.024, 16), steelMat);
        heightRod.position.set(px, TABLE_H - 0.024, NET_Z);
        scene.add(heightRod);

        const heightKnob = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.016, 0.018, 24), blackPolymerMat);
        heightKnob.position.set(px, TABLE_H - 0.040, NET_Z);
        scene.add(heightKnob);

        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, postH, 32), postMat);
        post.position.set(px, postCenterY, NET_Z);
        post.castShadow = true;
        scene.add(post);

        const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.0115, 0.0115, 0.004, 32), blackPolymerMat);
        cap.position.set(px, TABLE_H + NET_H + 0.005, NET_Z);
        scene.add(cap);

        const baseCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.020, 24), silverMat);
        baseCollar.position.set(px, TABLE_H - 0.010, NET_Z);
        scene.add(baseCollar);
    });

    const woodFloorTex = makeWoodFloorTexture();
    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 36),
        new THREE.MeshStandardMaterial({ map: woodFloorTex, roughness: 0.38, metalness: 0.02 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, -1);
    floor.receiveShadow = true;
    scene.add(floor);

    const BACK_WALL_Z = 8.5;
    const wall = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 16),
        new THREE.MeshStandardMaterial({ color: bgHex, roughness: 0.88, metalness: 0.02, side: THREE.DoubleSide })
    );
    wall.position.set(0, 8.0, BACK_WALL_Z);
    wall.rotation.set(0, 0, 0);
    scene.add(wall);

    const baseboardH = 0.20;
    const baseboard = new THREE.Mesh(
        new THREE.BoxGeometry(50, baseboardH, 0.04),
        new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.30, metalness: 0.10 })
    );
    baseboard.position.set(0, baseboardH / 2, BACK_WALL_Z - 0.02);
    scene.add(baseboard);

    function render() {
        renderer.render(scene, camera);
    }

    function autoSize() {
        const vW = window.innerWidth;
        const vH = window.innerHeight;
        const isPortrait = vH > vW;

        if (isPortrait) {
            camera.position.set(0, TABLE_H + 0.58, -TABLE_LEN / 2 - 1.12);
            camera.lookAt(0, TABLE_H - 0.20, 0.26);

            const SQUISH_LENS = 1.03;
            const aspect = (vW / vH) * SQUISH_LENS;

            camera.updateMatrixWorld(true);

            const postOuterX = W_AT_NET / 2 + NET_OVERHANG + 0.015;
            const rightPostWorld = new THREE.Vector3(postOuterX, postCenterY, NET_Z);
            const rightPostCam = rightPostWorld.clone().applyMatrix4(camera.matrixWorldInverse);

            const desiredPostPx = (vW / 2) - 16;
            const xRatio = Math.abs(rightPostCam.x / -rightPostCam.z);

            const tanHalfH = (xRatio * (vW / 2)) / desiredPostPx;
            const tanHalfV = tanHalfH / aspect;
            camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(tanHalfV));

            camera.aspect = vW / vH;
            camera.updateProjectionMatrix();
            renderer.setSize(vW, vH);

            container.style.width = vW + 'px';
            container.style.height = vH + 'px';
        } else {
            camera.position.set(0, TABLE_H + 0.42, -TABLE_LEN / 2 - 0.72);
            camera.lookAt(0, TABLE_H - 0.01, 0.32);

            camera.updateMatrixWorld(true);

            const postOuterX = W_AT_NET / 2 + NET_OVERHANG + 0.015;
            const rightPostWorld = new THREE.Vector3(postOuterX, postCenterY, NET_Z);
            const rightPostCam = rightPostWorld.clone().applyMatrix4(camera.matrixWorldInverse);

            camera.fov = 64;
            const halfFovRad = THREE.MathUtils.degToRad(camera.fov / 2);
            const postPxFromCenter = Math.abs(rightPostCam.x / (-rightPostCam.z * Math.tan(halfFovRad))) * (vH / 2);
            const exactCropWidth = Math.round((postPxFromCenter + 25) * 2);
            const finalWidth = Math.min(vW, exactCropWidth);

            container.style.width = finalWidth + 'px';
            container.style.height = vH + 'px';

            camera.aspect = finalWidth / vH;
            camera.updateProjectionMatrix();
            renderer.setSize(finalWidth, vH);
        }

        render();
    }

    autoSize();
    window.addEventListener('resize', autoSize);
    window.addEventListener('orientationchange', () => {
        setTimeout(autoSize, 120);
    });

    // =========================================================================
    // CSS FRAME CONTROLLER
    // =========================================================================
    let activeFrame = 0;
    window.activeFrame = 0;

    const scrubHint = document.getElementById('scrub-hint');

    function applyFrame(frameNum) {
        activeFrame = Math.max(0, Math.min(18, frameNum));
        window.activeFrame = activeFrame;

        const card = document.getElementById('portal-card');
        const container = document.getElementById('canvas-container');
        const ballLayer = document.getElementById('ball-layer');

        if (!card || !container || !ballLayer) return;

        if (activeFrame === 0) {
            container.style.display = 'none';
            ballLayer.style.clipPath = 'circle(150vh at 50% 50%)';
            card.style.transform = 'scale(1) translateY(0px)';
            if (scrubHint) scrubHint.textContent = "Frame: 0 (Original 100%) | Scroll Down";
        } 
        else {
            // Apply continuous button scaling/raising for all frames 1 through 18
            const scale = 1.0 - (activeFrame * 0.05);
            const yOffset = -(activeFrame * 24);
            card.style.transform = `scale(${scale.toFixed(2)}) translateY(${yOffset}px)`;

            if (activeFrame >= 1 && activeFrame <= 1) {
                // Frame 1: Ball covers screen, NO background revealed
                container.style.display = 'none';
                ballLayer.style.clipPath = 'circle(150vh at 50% 50%)';
                if (scrubHint) scrubHint.textContent = `Frame: ${activeFrame} (Card: ${Math.round(scale*100)}%) | NO Background`;
            } 
            else if (activeFrame >= 2) {
                // Frames 2-18: Background revealed, ball size shrinks by 10vh per frame
                container.style.display = 'block';
                autoSize();
                
                const ballDiameterVh = 115 - ((activeFrame - 2) * 10);
                const radiusVh = Math.max(0, ballDiameterVh / 2);
                
                ballLayer.style.clipPath = `circle(${radiusVh}vh at 50% 50%)`;
                
                if (scrubHint) scrubHint.textContent = `Frame: ${activeFrame} (Card: ${Math.round(scale*100)}%, Ball: ${ballDiameterVh}vh)`;
            }
        }
    }

    const copyPreviewBtn = document.getElementById('copy-preview-btn');
    if (copyPreviewBtn) {
        copyPreviewBtn.addEventListener('click', () => {
            applyFrame(1);
            if (scrubHint) scrubHint.style.display = 'block';
        });
    }

    window.addEventListener('wheel', (e) => {
        if (scrubHint && scrubHint.style.display === 'block') {
            e.preventDefault();
            if (e.deltaY > 0) applyFrame(activeFrame + 1);
            else applyFrame(activeFrame - 1);
        }
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
        if (scrubHint && scrubHint.style.display === 'block') {
            if (e.code === 'ArrowDown' || e.code === 'ArrowRight') applyFrame(activeFrame + 1);
            else if (e.code === 'ArrowUp' || e.code === 'ArrowLeft') applyFrame(activeFrame - 1);
        }
    });

    let scrubStartY = 0;
    window.addEventListener('touchstart', (e) => {
        if (activeFrame > 0 && e.touches.length === 1) {
            scrubStartY = e.touches[0].clientY;
        }
    }, {passive: false});

    window.addEventListener('touchmove', (e) => {
        if (activeFrame > 0 && scrubHint && scrubHint.style.display === 'block') {
            e.preventDefault();
        }
    }, {passive: false});

    window.addEventListener('touchend', (e) => {
        if (activeFrame > 0 && scrubHint && scrubHint.style.display === 'block') {
            let dy = e.changedTouches[0].clientY - scrubStartY;
            if (dy > 30) applyFrame(activeFrame - 1);
            else if (dy < -30) applyFrame(activeFrame + 1);
        }
    });

})();
</script>
</body>
</html>
